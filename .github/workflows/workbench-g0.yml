name: Workbench G0 engineering

on:
  pull_request:
  push:
    branches: [main, codex/workbench-workflow-provenance]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workbench-g0-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos-arm64:
    runs-on: macos-14
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PIP_NO_INPUT: "1"
      STREAMLIT_BROWSER_GATHER_USAGE_STATS: "false"
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0, node24
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0, node24
        with:
          python-version: "3.12.13"
          architecture: arm64
      - name: Create isolated environment and preserve installation evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir g0-evidence
          python -m venv "$RUNNER_TEMP/sckg-g0-env"
          "$RUNNER_TEMP/sckg-g0-env/bin/python" -I -m pip install \
            --only-binary=:all: --require-hashes --no-deps \
            -r release/locks/workbench-dev-osx-arm64-py312.requirements.lock \
            --report g0-evidence/install.json 2>&1 | tee g0-evidence/install.log
          "$RUNNER_TEMP/sckg-g0-env/bin/python" -I -m pip freeze --all > g0-evidence/environment.txt
      - name: Verify dependencies, smoke, full regression and full-app UI
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/sckg-g0-env/bin/python" -I -B scripts/verify_g0.py \
            --python "$RUNNER_TEMP/sckg-g0-env/bin/python" --output g0-evidence/checks
      - name: Preserve success or failure evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0, node24
        with:
          name: workbench-g0-${{ github.run_id }}-${{ github.run_attempt }}
          path: g0-evidence/
          if-no-files-found: error
          retention-days: 14
